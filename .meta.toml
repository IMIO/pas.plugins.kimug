# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.lock
.venv
htmlcov/
.mxdev_cache/
requirements.txt
*.pem
.env
"""

[pyproject]
codespell_skip = "*.min.js"
codespell_ignores = "vew"
dependencies_ignores = "['plone.app.iterate', 'plone.app.upgrade', 'plone.volto', 'zestreleaser.towncrier', 'zest.releaser', 'pytest-cov']"
check_manifest_ignores = """
    "tests/*.pem",
    "tests/.claude/*",
    ".env",
    ".envrc",
"""

[tox]
test_runner = "pytest"
test_path = "/tests"
test_matrix = {"6.2" = ["3.13", "3.12", "3.11", "3.10"], "6.1" = ["3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt", "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt"}
testenv_options = """
passenv =
    REQUESTS_CA_BUNDLE
"""

[github]
# No "circular": pytest-plone requires Products.CMFPlone[test], whose test extra
# (plone.app.testing, plone.app.robotframework...) depends back on CMFPlone.
jobs = [
    "qa",
    "coverage",
    "release_ready",
    ]
