    ".editorconfig",
    ".flake8",
    ".meta.toml",
    ".pre-commit-config.yaml",
    "dependabot.yml",
    "mx.ini",
    "tox.ini",
    "tests/*.pem",
    "tests/.claude/*",
    ".env",
    ".envrc",
]

